# Supabase CLI project config (local dev). `npx supabase start` to run locally.
project_id = "onarollcatering"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/dashboard/auth/callback"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "25MiB"
